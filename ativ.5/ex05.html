<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Criação de Bandeiras com Elementos Divs</title>
        <link rel="stylesheet" href="bandeira.css">
    </head>
</html>
        <div class="container-bandeira">
            <div class="bandeira flex-vertical">
            <div class="coluna ita-verde"></div>
            <div class="coluna ita-branco"></div>
            <div class="coluna ita-vermelho"></div>
        </div>
        <strong>Itália</strong>
    </div>
    <div class="container-bandeira">
        <div class="bandeira flex-vertical">
            <div class="coluna bel-preto"></div>
            <div class="coluna bel-amarelo"></div>
            <div class="coluna bel-vermelho"></div>
        </div>
        <strong>Bélgica</strong>
    </div>

    <div class="container-bandeira">
        <div class="bandeira flex-horizontal">
            <div class="faixa-2 pol-branco"></div>
            <div class="faixa-2 pol-vermelho"></div>
        </div>
        <strong>Polônia</strong>
    </div>
    <div class="container-bandeira">
        <div class="bandeira flex-horizontal">
            <div class="faixa-3 ale-preto"></div>
            <div class="faixa-3 ale-vermelho"></div>
            <div class="faixa-3 ale-amarelo"></div>
        </div>
        <strong>Alemanha</strong>
    </div>

    <div class="container-bandeira">
        <div class="bandeira inglaterra">
            <div class="cruz-v"></div>
            <div class="cruz-h"></div>
        </div>
        <strong>Inglaterra</strong>
    </div>

    <div class="container-bandeira">
        <div class="bandeira suecia">
            <div class="cruz-v"></div>
            <div class="cruz-h"></div>
        </div>
        <strong>Suécia</strong>
    </div>
    <div class="container-bandeira">
        <div class="bandeira brasil">
            <div class="losango"></div>
            <div class="circulo"></div>
        </div>
        <strong>Brasil</strong>
    </div>
</body>
</html>
