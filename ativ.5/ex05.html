<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeiras</title>
    <link rel="stylesheet" href="bandeira.css">
</head>
<body>
    <div>
    <div class="bandeira-vertical">
        <div class="faixa verde"></div>
        <div class="faixa branca"></div>
        <div class="faixa vermelha"></div>
    </div>
    <div class="bandeira-horizontal">
        <div class="faixa-h preta"></div>
        <div class="faixa-h vermelha-al"></div>
        <div class="faixa-h amarela"></div>
    </div>
    <div class="bandeira-nordica">
        <div class="cruz-horizontal"></div>
        <div class="cruz-vertical"></div>
    </div>
    <div class="bandeira-nordica">
        <div class="cruz-horizontal"></div>
        <div class="cruz-vertical"></div>
    </div>
    <div class="bandeira-brasil">
        <div class="losango">
            <div class="circulo"></div>
        </div>
    </div>

    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Bandeiras com Divs</title>
                    <link rel="stylesheet" href="bandeira.css">
                    </head>
                    <body>

                        <!-- 1. Listras Verticais (Itália) -->
                            <h2>Itália (Listras Verticais)</h2>
                                <div class="bandeira-vertical">
                                        <div class="faixa verde"></div>
                                                <div class="faixa branca"></div>
                                                        <div class="faixa vermelha"></div>
                                                            </div>

                                                                <!-- 2. Listras Horizontais (Alemanha) -->
                                                                    <h2>Alemanha (Listras Horizontais)</h2>
                                                                        <div class="bandeira-horizontal">
                                                                                <div class="faixa-h preta"></div>
                                                                                        <div class="faixa-h vermelha-al"></div>
                                                                                                <div class="faixa-h amarela"></div>
                                                                                                    </div>

                                                                                                        <!-- 3. Cruz de Formato Nórdico (Suécia) -->
                                                                                                            <h2>Suécia (Formato Nórdico)</h2>
                                                                                                                <div class="bandeira-nordica suecia">
                                                                                                                        <div class="cruz-horizontal"></div>
                                                                                                                                <div class="cruz-vertical"></div>
                                                                                                                                    </div>

                                                                                                                                        <!-- 4. Cruz de São Jorge (Inglaterra) -->
                                                                                                                                            <h2>Inglaterra (São Jorge)</h2>
                                                                                                                                                <div class="bandeira-nordica inglaterra">
                                                                                                                                                        <div class="cruz-horizontal"></div>
                                                                                                                                                                <div class="cruz-vertical"></div>
                                                                                                                                                                    </div>

                                                                                                                                                                        <!-- 5. Formas Geométricas Acopladas (Brasil) -->
                                                                                                                                                                            <h2>Brasil (Formas Acopladas)</h2>
                                                                                                                                                                                <div class="bandeira-brasil">
                                                                                                                                                                                        <div class="losango"></div>
                                                                                                                                                                                                <div class="circulo"></div>
                                                                                                                                                                                                    </div>

                                                                                                                                                                                                    </body>
                                                                                                                                                                                                    </html>
                                                                                                                                                                                                    

</body>
</html>
